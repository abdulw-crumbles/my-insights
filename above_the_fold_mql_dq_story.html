function hbar(card, rows, rowH){
  rowH=rowH||26; const pT=8, pB=6, labelW=158, pRight=54;
  const n=rows.length, H=pT+n*rowH+pB, plotX=labelW, plotW=W-labelW-pRight;
  const max=Math.max.apply(null,rows.map(r=>r.count));
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto">`;
  rows.forEach((r,i)=>{
    const y=pT+i*rowH, bh=rowH-11, by=y+5;
    const bw=plotW*r.count/max;
    s+=`<text x="${labelW-10}" y="${y+rowH/2+4}" text-anchor="end" font-size="12" fill="${INK}">${r.label}</text>`;
    s+=`<rect x="${plotX}" y="${by}" width="${bw.toFixed(1)}" height="${bh}" fill="${RED}"/>`;
    s+=`<text x="${plotX+bw+7}" y="${y+rowH/2+4}" font-size="12" fill="${MUT}" font-weight="600">${r.count}</text>`;
    s+=`<rect class="hit" data-i="${i}" x="0" y="${y}" width="${W}" height="${rowH}"/>`;
  });
  s+='</svg>';card.insertAdjacentHTML('beforeend',s);
  const N=AGG.n, svg=card.querySelector('svg'),tip=makeTip(card);
  svg.querySelectorAll('.hit').forEach(h=>{
    const r=rows[+h.dataset.i];
    const html=`<div class="td">${r.label}</div>`+
      `<div class="row"><span class="k">Opps</span><b>${r.count}</b> <span class="k">${(100*r.count/N).toFixed(0)}%</span></div>`+
      `<div class="row"><span class="k">Reached demo</span><b>${r.demo}</b></div>`+
      (r.amt>0?`<div class="row"><span class="k">Amount</span><b>${r.amt.toLocaleString()}</b></div>`:``);
    h.addEventListener('mousemove',e=>moveTip(tip,card,e.clientX,e.clientY,html));
    h.addEventListener('mouseleave',()=>tip.style.opacity='0');
  });
}

function segbar(card, segs, total){

  segs.forEach((g,i)=>{
    const w=plotW*g.count/total;
    s+=`<rect class="seg" data-i="${i}" x="${x.toFixed(1)}" y="${barY}" width="${w.toFixed(1)}" height="${barH}" fill="${COL[g.label]}"/>`;

  const svg=card.querySelector('svg'),tip=makeTip(card);
  svg.querySelectorAll('.seg').forEach(el=>{
    const g=segs[+el.dataset.i];
    const html=`<div class="td">${disp(g.label)}</div><div class="row"><span class="k">Opps</span><b>${g.count}</b> <span class="k">${(100*g.count/total).toFixed(0)}%</span></div><div class="row"><span class="k">${g.note}</span></div>`;
    el.style.cursor='pointer';
    el.addEventListener('mousemove',e=>moveTip(tip,card,e.clientX,e.clientY,html));

    const ord={'Genuine discovery':0,'Likely genuine':1,'Borderline':2,'Not genuine':3};
    return ord[a.cat]-ord[b.cat] || a.region.localeCompare(b.region);
  });
  const body=detRows.map(r=>{
    const call = r.gong==='YES' ? `${r.dur} min` : 'no recording';
    const link = r.url ? `<a href="${r.url}" target="_blank" rel="noopener" style="color:#c00000;text-decoration:none;border-bottom:1px dotted #c00000">listen</a>` : '<span style="color:#bbb">&mdash;</span>';
    const amt = r.amount>0 ? r.amount.toLocaleString() : '<span style="color:#bbb">&mdash;</span>';
    return `<tr>
      <td>${r.name}</td>
      <td style="font-family:monospace;font-size:11px;color:#666">${r.opp_id}</td>
      <td>${r.ae}</td><td>${r.region}</td><td>${r.reason}</td><td>${r.sub}</td>
      <td style="text-align:right">${amt}</td>
      <td class="wrapnote">${r.desc||'<span style=\'color:#bbb\'>&mdash;</span>'}</td>
      <td>${r.demo}</td><td style="text-align:right">${call}</td>
      <td><span style="color:${catColor[r.cat]};font-weight:600">${cdisp(r.cat)}</span></td>
      <td style="text-align:center">${link}</td></tr>`;
  }).join('');
  panel.innerHTML=`
    <div class="steptitle">03 &middot; Genuine vs Hygiene</div>
    <p class="stepsub">The 20 SQLs that moved Q2, checked against Gong. Did a real demo actually happen behind the delivered-demo date? Hover the bar, and open any call to verify.</p>
    <div class="tiles">
      <div class="tile"><div class="tl">Genuine Cases</div><div class="tb">7</div><div class="ts">real discovery calls, 15 to 54 min</div></div>
      <div class="tile"><div class="tl">Borderline Cases</div><div class="tb">3</div><div class="ts">short calls, 8 to 9 min</div></div>
      <div class="tile"><div class="tl">Weak Cases</div><div class="tb">10</div><div class="ts">9 no recording, 1 too short</div></div>
    </div>
    <div class="readbox">
      <b>Gong reframes the SQL loss.</b>
      <ul>
        <li><b>Only 7 of the 20 were real SQLs.</b> Three genuine discovery calls and four likely genuine, 15 to 54 minutes. The true Q2 SQL loss is closer to 7 than 20.</li>
        <li><b>Half had no demo at all.</b> 10 are not genuine, 9 with no Gong recording despite a delivered-demo date, 1 too short at 4 minutes. The delivered-demo date was phantom.</li>
        <li><b>The phantom pattern is Rhema's No Shows.</b> Six of her No Show SQLs have no recording. Two others tagged No Show actually had real 19 to 21 minute calls, so they were mislabeled.</li>
        <li><b>Trust the date only when a call backs it.</b> Gating SQL on a recorded demo, not just a date field, would have kept these 10 out of the SQL count in the first place.</li>
      </ul>
    </div>
    <div class="chartcard" id="c-seg"><div class="cardhead"><span class="cardname">The 20 SQLs by Gong verdict</span><span class="cardnote">hover a segment</span></div></div>
    <div class="chartcard" style="padding-bottom:16px">
      <div class="cardhead"><span class="cardname">Call-by-call verification</span><span class="cardnote">sorted by verdict &middot; links open Gong</span></div>
      <div style="overflow:auto">
      <table class="mini" style="min-width:1180px">
        <thead><tr><th>Opportunity</th><th>Opp ID</th><th>AE</th><th>Region</th><th>DQ reason</th><th>Sub reason</th><th style="text-align:right">Amount</th><th>Closed-lost note</th><th>Demo date</th><th style="text-align:right">Call</th><th>Verdict</th><th style="text-align:center">Gong</th></tr></thead>
        <tbody>${body}</tbody>
      </table></div>
    </div>`;
  segbar(panel.querySelector('#c-seg'), t.segs, N);
}

function axVal(r,f){let v=r[f];if(v===null||v===undefined||v==='')return '(blank)';return String(v);}
function axEsc(s){s=(s===null||s===undefined)?'':String(s);return '"'+s.replace(/"/g,'""')+'"';}
function axToCSV(rows){if(!rows.length)return '';const keys=Object.keys(AX_DATA[0]);return keys.join(',')+'\n'+rows.map(r=>keys.map(k=>axEsc(r[k])).join(',')).join('\n');}
function axDlRows(rows,fname){const b=new Blob([axToCSV(rows)],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fname;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function axSafe(s){return String(s).replace(/[^a-z0-9]+/gi,'_').slice(0,40);}
function axHead(c){return AX_HEADLBL[c]||AX_LABEL[c]||c.replace(/^opp_/,'').replace(/_/g,' ');}
function axFmtcell(v){if(v===null||v===undefined||v==='')return '<span style="color:#bbb">&mdash;</span>';return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function axShowDetail(rows,label,fname){
  axCUR=rows;axCURNAME=fname||'selection';
  const el=document.getElementById('ax-detail');if(!el)return;
  if(!rows.length){el.innerHTML='<div class="empty">No opportunities match that selection.</div>';return;}
  let amt=rows.reduce((s,r)=>s+(Number(r.opp_pipeline_amount)||0),0);
  let acc=new Set(rows.map(r=>r.opp_account_id)).size;
  const head=`<div class="dhead"><div><div class="dtitle">${label} &nbsp;<b>${rows.length}</b> opps</div>
     <div class="dsub">${acc} distinct accounts &middot; pipeline amount ${amt?amt.toLocaleString():'0'}</div></div>
     <button class="dlall" onclick="axDlRows(axCUR,'mql_dq_appendix_'+axSafe(axCURNAME)+'.csv')">Download these ${rows.length}</button></div>`;
  const th=AX_DETAIL_COLS.map(c=>`<th>${axHead(c)}</th>`).join('');
  const body=rows.map(r=>'<tr>'+AX_DETAIL_COLS.map(c=>`<td class="${AX_WRAP.has(c)?'wrap':''}">${axFmtcell(r[c])}</td>`).join('')+'</tr>').join('');
  el.innerHTML=head+`<div class="dscroll"><table class="det"><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table></div>`;
  el.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function axDistinct(f){const s=new Set();AX_DATA.forEach(r=>s.add(axVal(r,f)));return [...s].sort((a,b)=>a.localeCompare(b));}
function axRefresh(){axRenderDropdowns();axRenderFilters();axRenderZones();axRenderPivot();}
function axDDsummary(arr,label){
  if(!arr.length)return `<span class="lab">${label}</span><span class="sel none">none selected</span>`;
  return `<span class="lab">${label} <span class="cnt">${arr.length}</span></span><span class="sel">${arr.map(f=>AX_LABEL[f]).join(', ')}</span>`;
}
function axPanelOpts(zone){
  return AX_DIMS.map(([f,l])=>{
    const inRow=axRowFields.includes(f),inCol=axColFields.includes(f),inFil=axFilterFields.includes(f);
    const here=(zone==='row'&&inRow)||(zone==='col'&&inCol)||(zone==='filter'&&inFil);
    const elsewhere=!here&&(inRow||inCol||inFil);
    const where=inRow?'in Rows':inCol?'in Columns':inFil?'in Filters':'';
    return `<label class="axdd-opt ${elsewhere?'taken':''}"><input type="checkbox" ${here?'checked':''} onchange="axSetField('${f}','${zone}')"><span>${l}</span>${elsewhere?`<span class="where">${where}</span>`:''}</label>`;
  }).join('');
}
function axRenderDropdowns(){
  [['row','Rows',axRowFields],['col','Columns',axColFields],['filter','Filters',axFilterFields]].forEach(([zone,label,arr])=>{
    const el=document.getElementById('axdd-'+zone);if(!el)return;
    el.innerHTML=`<button type="button" class="axdd-btn" onclick="axToggleDropdown('${zone}')">${axDDsummary(arr,label)}</button><div class="axdd-panel">${axPanelOpts(zone)}</div>`;
  });
}
function axToggleDropdown(zone){
  const el=document.getElementById('axdd-'+zone);if(!el)return;
  const wasOpen=el.classList.contains('open');
  axCloseAllDropdowns();
  if(!wasOpen)el.classList.add('open');
}
function axCloseAllDropdowns(){document.querySelectorAll('#ax-root .axdd.open').forEach(e=>e.classList.remove('open'));}
function axSetField(f,zone){
  const already=(zone==='row'&&axRowFields.includes(f))||(zone==='col'&&axColFields.includes(f))||(zone==='filter'&&axFilterFields.includes(f));
  axRowFields=axRowFields.filter(x=>x!==f);
  axColFields=axColFields.filter(x=>x!==f);
  axFilterFields=axFilterFields.filter(x=>x!==f);
  if(!already){
    if(zone==='row')axRowFields.push(f);
    else if(zone==='col')axColFields.push(f);
    else axFilterFields.push(f);
  }
  Object.keys(axFilterState).forEach(k=>{if(!axFilterFields.includes(k))delete axFilterState[k];});
  axFilterFields.forEach(k=>{if(!axFilterState[k])axFilterState[k]=new Set(axDistinct(k));});
  axRefresh();
}
function axAddField(f,zone){
  axRowFields=axRowFields.filter(x=>x!==f);axColFields=axColFields.filter(x=>x!==f);axFilterFields=axFilterFields.filter(x=>x!==f);
  if(zone==='filter'){axFilterFields.push(f);if(!axFilterState[f])axFilterState[f]=new Set(axDistinct(f));}
  else if(zone==='row'){axRowFields.push(f);}else{axColFields.push(f);}
  axRefresh();
}
function axRemoveField(zone,i){
  if(zone==='filter'){const f=axFilterFields[i];axFilterFields.splice(i,1);delete axFilterState[f];}
  else if(zone==='row'){axRowFields.splice(i,1);}else{axColFields.splice(i,1);}
  axRefresh();
}
function axMoveField(zone,i,d){const a=(zone==='row'?axRowFields:axColFields);const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];axRefresh();}
function axToggleFilterVal(f,v){const st=axFilterState[f];if(st.has(v))st.delete(v);else st.add(v);axRenderFilters();axRenderPivot();}
function axFilterAll(f,on){axFilterState[f]=on?new Set(axDistinct(f)):new Set();axRenderFilters();axRenderPivot();}
function axRenderFilters(){
  const host=document.getElementById('ax-filterzone');if(!host)return;
  if(!axFilterFields.length){host.innerHTML='<div class="zlab">Filters</div><span class="pivscope">none. add a field with the Filter button.</span>';return;}
  host.innerHTML='<div class="zlab">Filters</div>'+axFilterFields.map((f,i)=>{
    const vals=axDistinct(f);const sel=axFilterState[f];
    const chips=vals.map(v=>`<span class="fval ${sel.has(v)?'on':'off'}" onclick="axToggleFilterVal('${f}',${JSON.stringify(v).replace(/"/g,'&quot;')})">${v}</span>`).join('');
    return `<div class="filterfield"><div class="ffname">${AX_LABEL[f]}
       <button onclick="axRemoveField('filter',${i})" title="remove">&times;</button>
       <span class="miniact"><a onclick="axFilterAll('${f}',true)">all</a> &middot; <a onclick="axFilterAll('${f}',false)">none</a></span></div>${chips}</div>`;
  }).join('');
}
function axRenderZones(){
  const mk=(arr,zone)=>arr.map((f,i)=>`<span class="tag">${AX_LABEL[f]}
     <button class="up" title="move left" onclick="axMoveField('${zone}',${i},-1)">&lsaquo;</button>
     <button class="dn" title="move right" onclick="axMoveField('${zone}',${i},1)">&rsaquo;</button>
     <button title="remove" onclick="axRemoveField('${zone}',${i})">&times;</button></span>`).join('');
  const rz=document.getElementById('ax-rowzone'),cz=document.getElementById('ax-colzone');
  if(rz){rz.innerHTML=axRowFields.length?('<div class="zlab">Row order</div>'+mk(axRowFields,'row')):'';rz.style.display=axRowFields.length?'':'none';}
  if(cz){cz.innerHTML=axColFields.length?('<div class="zlab">Column order</div>'+mk(axColFields,'col')):'';cz.style.display=axColFields.length?'':'none';}
}
function axFilteredData(){return AX_DATA.filter(r=>axFilterFields.every(f=>axFilterState[f].has(axVal(r,f))));}
function axCombos(fields,base){if(!fields.length)return [[]];const seen=new Map();base.forEach(r=>{const key=fields.map(f=>axVal(r,f)).join('\u0001');if(!seen.has(key))seen.set(key,fields.map(f=>axVal(r,f)));});return [...seen.values()].sort((a,b)=>a.join('/').localeCompare(b.join('/')));}
function axMatches(r,fields,vals){return fields.every((f,i)=>axVal(r,f)===vals[i]);}
function axMeasureVal(rows){const m=document.getElementById('ax-measure').value;if(m==='count')return rows.length;if(m==='amount')return rows.reduce((s,r)=>s+(Number(r.opp_pipeline_amount)||0),0);return new Set(rows.map(r=>r.opp_account_id)).size;}
function axFmt(v){const m=document.getElementById('ax-measure').value;if(m==='amount')return v?v.toLocaleString():'';return v||'';}
function axCondStr(rf,rv,cf,cv){const parts=[...rf.map((ff,k)=>`axVal(r,'${ff}')===${JSON.stringify(rv[k])}`),...cf.map((ff,k)=>`axVal(r,'${ff}')===${JSON.stringify(cv[k])}`)];return parts.length?parts.join('&&'):'true';}
function axDrill(cond,label,fname){const base=axFilteredData();const fn=new Function('r','axVal','return '+cond);axShowDetail(base.filter(r=>fn(r,axVal)),label,fname);}
function axCaret(key){return axSort.key===key?`<span class="sortcaret">${axSort.dir<0?'\u25BC':'\u25B2'}</span>`:'';}
function axSortBy(key){
  if(axSort.key===key)axSort.dir=-axSort.dir;
  else{axSort.key=key;axSort.dir=key.charAt(0)==='f'?1:-1;}
  axRenderPivot();
}
function axApplySort(rc,cc,base){
  const k=axSort.key,dir=axSort.dir;if(!k)return;
  const rowMeasure=(rv,cv)=>axMeasureVal(base.filter(r=>axMatches(r,axRowFields,rv)&&(cv?axMatches(r,axColFields,cv):true)));
  let cmp=null;
  if(k.charAt(0)==='f'){const idx=+k.slice(1);if(idx<axRowFields.length)cmp=(a,b)=>String(a[idx]).localeCompare(String(b[idx]))*dir;}
  else if(k==='total'){cmp=(a,b)=>(rowMeasure(a,null)-rowMeasure(b,null))*dir;}
  else if(k.slice(0,2)==='c:'){const lbl=k.slice(2);const cv=cc.find(x=>(x.join(' / ')||'Total')===lbl);if(cv)cmp=(a,b)=>(rowMeasure(a,cv)-rowMeasure(b,cv))*dir;}
  if(cmp)rc.sort(cmp);
}
function axRenderPivot(){
  const base=axFilteredData();
  const sc=document.getElementById('ax-pivscope');if(sc)sc.textContent=axFilterFields.length?`(${base.length} of ${AX_N} after filters)`:`(all ${AX_N})`;
  const rc=axCombos(axRowFields,base), cc=axCombos(axColFields,base);
  axApplySort(rc,cc,base);
  let head1='';axRowFields.forEach((f,i)=>head1+=`<th class="sortable${axSort.key==='f'+i?' sorted':''}" onclick="axSortBy('f${i}')">${AX_LABEL[f]}${axCaret('f'+i)}</th>`);if(!axRowFields.length)head1+='<th></th>';
  cc.forEach(cv=>{const ck='c:'+(cv.join(' / ')||'Total');head1+=`<th class="num sortable${axSort.key===ck?' sorted':''}" onclick="axSortBy(${JSON.stringify(ck).replace(/"/g,'&quot;')})">${cv.join(' / ')||'Total'}${axCaret(ck)}</th>`;});
  head1+=`<th class="num tot sortable${axSort.key==='total'?' sorted':''}" onclick="axSortBy('total')">Row total${axCaret('total')}</th>`;
  let bodyRows='';
  rc.forEach(rv=>{
    let tds='';
    axRowFields.forEach((f,i)=>{
      const cond=axRowFields.map((ff,k)=>`axVal(r,'${ff}')===${JSON.stringify(rv[k])}`).join('&&')||'true';
      tds+=`<td class="rowh" onclick="axDrill(${JSON.stringify(cond).replace(/"/g,'&quot;')},'${rv.join(' / ').replace(/'/g,"")}','row_${axSafe(rv.join('_'))}')" title="Inspect">${rv[i]}</td>`;});
    if(!axRowFields.length)tds+=`<td class="rowh">All</td>`;
    cc.forEach(cv=>{
      const rows=base.filter(r=>axMatches(r,axRowFields,rv)&&axMatches(r,axColFields,cv));
      if(rows.length){const cond=axCondStr(axRowFields,rv,axColFields,cv);const lab=[...rv,...cv].filter(x=>x).join(' / ')||'All';
        tds+=`<td class="cell" onclick="axDrill(${JSON.stringify(cond).replace(/"/g,'&quot;')},'${lab.replace(/'/g,"")}','cell_${axSafe(rv.join('_'))}_${axSafe(cv.join('_'))}')" title="Inspect ${rows.length}">${axFmt(axMeasureVal(rows))}</td>`;}
      else{tds+=`<td class="cell zero">&middot;</td>`;}
    });
    const rowAll=base.filter(r=>axMatches(r,axRowFields,rv));
    const rcond=axRowFields.map((ff,k)=>`axVal(r,'${ff}')===${JSON.stringify(rv[k])}`).join('&&')||'true';
    tds+=`<td class="cell tot" onclick="axDrill(${JSON.stringify(rcond).replace(/"/g,'&quot;')},'${rv.join(' / ').replace(/'/g,"")}','rowtot_${axSafe(rv.join('_'))}')" title="Inspect ${rowAll.length}">${axFmt(axMeasureVal(rowAll))}</td>`;
    bodyRows+=`<tr>${tds}</tr>`;
  });
  let foot='<tr>';const rowSpan=Math.max(1,axRowFields.length);foot+=`<td class="rowh tot" colspan="${rowSpan}">Column total</td>`;
  cc.forEach(cv=>{const rows=base.filter(r=>axMatches(r,axColFields,cv));const cond=axColFields.map((ff,k)=>`axVal(r,'${ff}')===${JSON.stringify(cv[k])}`).join('&&')||'true';
    foot+=`<td class="cell tot" onclick="axDrill(${JSON.stringify(cond).replace(/"/g,'&quot;')},'${cv.join(' / ').replace(/'/g,"")}','coltot_${axSafe(cv.join('_'))}')">${axFmt(axMeasureVal(rows))}</td>`;});
  foot+=`<td class="cell tot" onclick="axDrill('true','All ${base.length}','grandtotal')">${axFmt(axMeasureVal(base))}</td></tr>`;
  const pv=document.getElementById('ax-pivot');if(pv)pv.innerHTML=`<table class="pv"><thead><tr>${head1}</tr></thead><tbody>${bodyRows}${foot}</tbody></table>`;
}
function axDownloadPivot(){
  const base=axFilteredData();const rc=axCombos(axRowFields,base), cc=axCombos(axColFields,base);
  const header=[...axRowFields.map(f=>AX_LABEL[f]),...cc.map(cv=>cv.join(' / ')||'Total'),'Row total'];
  const lines=[header.map(axEsc).join(',')];
  rc.forEach(rv=>{const cells=[...rv];cc.forEach(cv=>{cells.push(axMeasureVal(base.filter(r=>axMatches(r,axRowFields,rv)&&axMatches(r,axColFields,cv))));});cells.push(axMeasureVal(base.filter(r=>axMatches(r,axRowFields,rv))));lines.push(cells.map(axEsc).join(','));});
  const totrow=['Column total',...Array(Math.max(0,axRowFields.length-1)).fill('')];cc.forEach(cv=>totrow.push(axMeasureVal(base.filter(r=>axMatches(r,axColFields,cv)))));totrow.push(axMeasureVal(base));lines.push(totrow.map(axEsc).join(','));
  const b=new Blob([lines.join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mql_dq_appendix_pivot.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function renderTab5(panel){
  // reset state on each visit
  axRowFields=['opp_dq_subreason'];axColFields=['opp_region'];axFilterFields=[];axFilterState={};axCUR=[];axCURNAME='selection';axSort={key:null,dir:-1};
  panel.innerHTML=`
    <div class="steptitle">05 &middot; Appendix</div>
    <p class="stepsub">All ${AX_N} Marketing opps disqualified between 30 Jun and 02 Jul 2026. Drag fields into Rows, Columns or Filters, switch the measure, then click any number to drill into the opps behind it and download them.</p>
    <div id="ax-root">
      <div class="pivot">
        <div class="axdd-bar">
          <div class="axdd" id="axdd-row"></div>
          <div class="axdd" id="axdd-col"></div>
          <div class="axdd" id="axdd-filter"></div>
        </div>
        <div class="zones">
          <div id="ax-rowzone" class="zone"></div>
          <div id="ax-colzone" class="zone"></div>
        </div>
        <div id="ax-filterzone" class="filterzone"></div>
        <div class="measure">Measure:
          <select id="ax-measure" onchange="axRenderPivot()">
            <option value="count">Opp count</option>
            <option value="amount">Pipeline amount</option>
            <option value="accounts">Distinct accounts</option>
          </select>
          <span id="ax-pivscope" class="pivscope"></span>
          <button class="dlall" style="margin-left:10px" onclick="axDownloadPivot()">Download pivot</button>
        </div>
        <div class="pivot-scroll"><div id="ax-pivot"></div></div>
      </div>
      <div id="ax-detail"><div class="empty">Click any number in the pivot to see the opportunities behind it.</div></div>
    </div>`;
  if(!window.__axDocClick){window.__axDocClick=true;document.addEventListener('click',e=>{if(!e.target.closest('#ax-root .axdd'))axCloseAllDropdowns();});}
  axRefresh();
}

render();
</script>
