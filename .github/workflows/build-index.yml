name: Build insights index

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'        # the bot's own commit must not retrigger this
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for git dates)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate index.html
        run: python build_index.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "Index unchanged, nothing to commit."
          else
            git commit -m "chore: rebuild insights index [skip ci]"
            git push
          fi
